<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>استوديو المحتوى</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4623f'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23ffffff'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="top">
  <button class="brand" id="goHome"><span class="mark">◈</span> استوديو المحتوى</button>
  <div class="top-actions">
    <button class="link" id="goLibrary">المحفوظ <span id="libCount"></span></button>
    <button class="icon-btn" id="openSettings" aria-label="الإعدادات">⚙</button>
  </div>
</header>

<main>

  <!-- الإعداد لأول مرة / تعديل العميل -->
  <section id="view-setup" class="hidden">
    <h1 id="setupTitle">لمن تكتب؟</h1>
    <p class="lead">مرة وحدة بس. كل شيء بعدها يُكتب لهذا الشخص.</p>
    <form id="icpForm" class="form">
      <label>مجالك وما تقدّمه<input name="niche" required placeholder="استشارات تسويق للمطاعم في الرياض"></label>
      <label>عميلك المثالي<textarea name="who" rows="2" placeholder="مالك مطعم جديد، أقل من سنتين، يصرف على الإعلانات ولا يرى نتيجة"></textarea></label>
      <label>وش يوجعه، ووش يبغى؟<textarea name="pains" rows="2" placeholder="مبيعات ضعيفة، ما يعرف وش ينشر… يبغى طاولات مليانة"></textarea></label>
      <label>نبرتك<input name="voice" placeholder="سعودية بيضاء، مباشرة، بلا مبالغة"></label>
      <details class="more">
        <summary>تفاصيل إضافية (اختياري)</summary>
        <label>عرضك<input name="offer"></label>
        <label>لا تستهدف<input name="avoid" placeholder="الباحثين عن المجاني"></label>
        <label>أرقام أفضل منشوراتك — أقوى دليل للدراسة
          <textarea name="data" rows="4" placeholder="ريل «٣ أخطاء…» — 120k مشاهدة، 4k حفظ، +310 متابع"></textarea>
        </label>
      </details>
      <label id="keyRow">مفتاح Anthropic API<input name="apiKey" type="password" dir="ltr" autocomplete="off" placeholder="sk-ant-…"></label>
      <div class="row-end">
        <button type="button" class="btn ghost" id="cancelSetup">إلغاء</button>
        <button class="btn primary">حفظ</button>
      </div>
    </form>
  </section>

  <!-- الرئيسية -->
  <section id="view-home" class="hidden">
    <p class="for">تكتب لـ <b id="forWho"></b> <button class="link" id="editIcp">تعديل</button></p>

    <div class="composer">
      <div class="seg" id="platforms"></div>
      <div class="seg" id="goal"></div>
      <input id="topic" placeholder="عن ماذا؟ (اختياري — اتركه وأنا أختار)">
      <button class="btn primary big" id="run">اكتب لي</button>
    </div>

    <p class="basis" id="basis"></p>
    <div id="researchPanel" class="hidden"></div>

    <div id="status"></div>
    <div class="seg results-tabs hidden" id="resultTabs"></div>
    <div id="results"></div>
  </section>

  <!-- المحفوظ -->
  <section id="view-library" class="hidden">
    <h1>المحفوظ</h1>
    <div class="seg results-tabs" id="libTabs"></div>
    <div id="libOut"></div>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" class="form" id="settingsForm">
    <div class="dlg-head"><h2>الإعدادات</h2><button class="icon-btn" value="cancel" aria-label="إغلاق">✕</button></div>
    <label>مفتاح Anthropic API<input name="apiKey" type="password" dir="ltr" autocomplete="off" placeholder="sk-ant-…"></label>
    <label class="check"><input type="checkbox" name="remember"> تذكّره على هذا الجهاز</label>
    <label>عدد القطع لكل منصة
      <select name="count"><option>1</option><option>2</option><option>3</option><option>5</option></select>
    </label>
    <details class="more">
      <summary>متقدم</summary>
      <label>النموذج<input name="model" placeholder="claude-opus-5-5"></label>
      <label>العمق
        <select name="effort"><option value="medium">متوسط — أسرع</option><option value="high">عالٍ — أدق</option></select>
      </label>
      <label class="check"><input type="checkbox" name="webSearch"> البحث في الويب عند الدراسة</label>
      <button type="button" class="btn danger" id="wipe">محو كل البيانات</button>
    </details>
    <div class="row-end"><button class="btn primary" value="save">حفظ</button></div>
  </form>
</dialog>

<div class="toast-host" id="toasts"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
